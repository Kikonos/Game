    <script>
      // Paint the chosen theme before the app loads (Settings › Appearance; ui/theme.ts keeps it in step afterwards).
      // No settings yet: a player with saves had the dark look, a new install follows the device.
      try {
        var st = JSON.parse(localStorage.getItem('contrail-acmi:settings') || 'null');
        var hasSave = false;
        for (var i = 0; i < localStorage.length; i++) if ((localStorage.key(i) || '').indexOf('contrail-acmi:save:') === 0) hasSave = true;
        var pref = st ? (st.theme === 'light' || st.theme === 'dark' || st.theme === 'system' ? st.theme : 'dark') : hasSave ? 'dark' : 'system';
        var th = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
        var bg = th === 'light' ? '#eef2f7' : '#070b14';
        document.documentElement.dataset.theme = th;
        document.documentElement.style.background = bg;
        document.documentElement.style.colorScheme = th;
        document.querySelector('meta[name="theme-color"]').content = bg;
        document.querySelector('meta[name="color-scheme"]').content = th;
      } catch (e) {}
    </script>
    <script>
      // GitHub Pages serves this repository as-is; the playable build lives in play/.
      if (/\.github\.io$/.test(location.hostname) && !/\/play\//.test(location.pathname)) location.replace('play/' + location.search);
    </script>
