name: CI

# Work-in-progress branches are pushed as backups mid-change, so only the
# release branches and pull requests are checked.
on:
  pull_request:
  push:
    branches: [main, claude/contrail-airline-game]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
